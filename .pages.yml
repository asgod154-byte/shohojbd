media:
  input: public/assets/images
  output: /assets/images

options:
  base_url: https://shohojbd.pages.dev
  branch: main
  preview:
    deploy_hook: ""

content:
  - name: sorkari-seba
    label: সরকারি সেবা
    type: collection
    path: src/content/sorkari-seba
    view:
      fields: [title, pubDate, draft, featured]
      sort: [pubDate, desc]
      primary_field: title
    fields:
      - name: title
        label: শিরোনাম
        type: string
      - name: slug
        label: URL Slug (ফাইলনেমেও একই রাখুন)
        type: string
      - name: description
        label: বর্ণনা (SEO Meta Description)
        type: text
      - name: author
        label: লেখক
        type: string
      - name: category
        label: ক্যাটাগরি
        type: string
      - name: tags
        label: ট্যাগ
        type: list
      - name: pubDate
        label: প্রকাশের তারিখ
        type: date
      - name: updatedDate
        label: আপডেটের তারিখ
        type: date
        required: false
      - name: draft
        label: ড্রাফট
        type: boolean
      - name: featured
        label: ফিচার্ড
        type: boolean
      - name: coverImage
        label: কভার ইমেজ
        type: image
        required: false
      - name: coverImageAlt
        label: কভার ইমেজ বর্ণনা
        type: string
        required: false
      - name: officialLinks
        label: অফিসিয়াল লিংকসমূহ
        type: list
        fields:
          - name: label
            label: লিংকের নাম
            type: string
          - name: url
            label: লিংক URL
            type: string
      - name: faq
        label: সচরাচর জিজ্ঞাসা (FAQ)
        type: list
        fields:
          - name: question
            label: প্রশ্ন
            type: string
          - name: answer
            label: উত্তর
            type: text
      - name: body
        label: কন্টেন্ট
        type: rich-text

